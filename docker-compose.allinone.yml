# ============================================================================
# All-in-one deployment: PostgreSQL + backend + frontend in a SINGLE container.
#
#   docker compose -f docker-compose.allinone.yml up -d --build
#
#   web     -> http://localhost:3000
#   API     -> http://localhost:4040 (health: /health)
#
# Postgres data, uploads and exports persist in the `open-task-data` volume
# (mount point /data inside the container).
# ============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.allinone
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4040}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-open}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open}
      POSTGRES_DB: ${POSTGRES_DB:-opentask}
      DATABASE_URL: postgresql://${POSTGRES_USER:-open}:${POSTGRES_PASSWORD:-open}@127.0.0.1:5432/${POSTGRES_DB:-opentask}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod-min-32-chars}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      PORT: 4040
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
      NODE_ENV: production
    ports:
      - "3000:3000"
      - "4040:4040"
    volumes:
      - open-task-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4040/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  open-task-data:
