services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-open}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open}
      POSTGRES_DB: ${POSTGRES_DB:-opentask}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-open}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-open}:${POSTGRES_PASSWORD:-open}@db:5432/${POSTGRES_DB:-opentask}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod-min-32-chars}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      PORT: 4040
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    ports:
      - "4040:4040"
    volumes:
      - ./uploads:/app/apps/backend/uploads
      - ./exports:/app/apps/backend/exports

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4040}
        VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL:-http://localhost:3000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
