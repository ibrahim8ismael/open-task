services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-open}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open}
      POSTGRES_DB: ${POSTGRES_DB:-opentask}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-open}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    command: pnpm dev
    working_dir: /app/apps/backend
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-open}:${POSTGRES_PASSWORD:-open}@db:5432/${POSTGRES_DB:-opentask}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod-min-32-chars}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  pgdata:
